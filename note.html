<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Zemen Day Note</title>
    <link rel="stylesheet" href="widget.css">
  </head>
  <body class="note-window" data-theme="dark">
    <main class="note-shell">
      <header class="note-heading">
        <p>DAY NOTE</p>
        <h1 id="note-date">Ethiopian date</h1>
        <span id="note-gregorian">Gregorian date</span>
      </header>

      <fieldset class="intensity-field">
        <legend>Day color</legend>
        <div class="intensity-options">
          <label class="intensity-option clear-level" title="No color">
            <input type="radio" name="note-level" value="0" aria-label="No day color">
            <span></span>
          </label>
          <label class="intensity-option level-1" title="Light">
            <input type="radio" name="note-level" value="1" aria-label="Light day color">
            <span></span>
          </label>
          <label class="intensity-option level-2" title="Medium">
            <input type="radio" name="note-level" value="2" aria-label="Medium day color">
            <span></span>
          </label>
          <label class="intensity-option level-3" title="Strong">
            <input type="radio" name="note-level" value="3" aria-label="Strong day color">
            <span></span>
          </label>
          <label class="intensity-option level-4" title="Complete">
            <input type="radio" name="note-level" value="4" aria-label="Complete day color">
            <span></span>
          </label>
        </div>
      </fieldset>

      <label class="note-label" for="note-text">What matters on this day?</label>
      <textarea id="note-text" rows="7" maxlength="2000" placeholder="A thought, milestone, task, or reminder…"></textarea>
      <p class="note-hint">Saved only on this device · Ctrl + Enter to save</p>

      <footer class="note-actions">
        <button class="delete-button hidden" id="delete-note" type="button">Delete note</button>
        <div>
          <button class="secondary-button" id="cancel-note" type="button">Cancel</button>
          <button class="primary-button" id="save-note" type="button">Save note</button>
        </div>
      </footer>
    </main>

    <script src="src/calendar.js"></script>
    <script src="src/note.js"></script>
  </body>
</html>
