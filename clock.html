<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Zemen Clock Widget</title>
    <link rel="stylesheet" href="widget.css">
  </head>
  <body class="clock-widget" data-theme="dark">
    <main class="widget-shell clock-shell" id="widget-shell">
      <header class="clock-header hidden" id="clock-header">
        <span>Ethiopian time</span>
        <button class="widget-menu-button no-drag" id="open-controls" type="button" aria-label="Open controls" title="Open controls">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.8 2.8h2.4l.5 1.7c.5.2 1 .4 1.4.8l1.6-.7 1.7 1.7-.7 1.6c.4.4.6.9.8 1.4l1.7.5v2.4l-1.7.5c-.2.5-.4 1-.8 1.4l.7 1.6-1.7 1.7-1.6-.7c-.4.4-.9.6-1.4.8l-.5 1.7H8.8l-.5-1.7c-.5-.2-1-.4-1.4-.8l-1.6.7-1.7-1.7.7-1.6c-.4-.4-.6-.9-.8-1.4l-1.7-.5V9.8l1.7-.5c.2-.5.4-1 .8-1.4l-.7-1.6 1.7-1.7 1.6.7c.4-.4.9-.6 1.4-.8l.5-1.7Z"/><circle cx="10" cy="11" r="2.6"/></svg>
        </button>
      </header>
      <section class="clock-content" id="clock-content">
        <div class="clock-line">
          <time id="clock-time">--:--:--</time>
          <span
            class="daypart"
            id="clock-daypart"
            lang="am"
          >
            ጧት
          </span>
          <span class="clock-date" id="clock-date">Loading Ethiopian date…</span>
        </div>
      </section>
      <div class="clock-hover-details" id="clock-hover-details" aria-hidden="true">
        <span id="timezone-label">Local timezone</span>
        <span id="clock-year-progress">Day — of —</span>
        <span>Right-click for controls</span>
      </div>
    </main>

    <script src="src/calendar.js"></script>
    <script src="src/clock-widget.js"></script>
  </body>
</html>
